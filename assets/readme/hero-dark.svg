<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">TaskNotes Countdown</title>
  <desc id="d">A deadline five days away: 75% of the time gone, tight at 1.5 hours a day, one step that should already have started and one waiting on an advisor.</desc>
  <rect width="1200" height="400" rx="28" fill="#15141B"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <text x="64" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#A48BFF">OBSIDIAN PLUGIN · FOR TASKNOTES</text>
    <text x="62" y="190" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#EEECF5">TaskNotes Countdown</text>
    <text x="64" y="248" font-size="29" fill="#9C98AF">Days left is the easy part.</text>
    <text x="64" y="288" font-size="29" fill="#EEECF5">Can you still make it?</text>
    <text x="64" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9C98AF">free · read-only · no network</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <rect x="740" y="44" width="400" height="312" rx="22" fill="#1E1D26" stroke="#2C2A36"/>
    <text x="768" y="88" font-size="21" font-weight="600" fill="#EEECF5">Graduate application</text>
    <path d="M1100 74 V90 M1093 81 L1100 74 L1107 81 M1092 86 V96 H1108 V86" fill="none" stroke="#9C98AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="764" y="160" font-size="76" font-weight="700" letter-spacing="-2" fill="#EEECF5">5</text>
    <text x="816" y="158" font-size="20" fill="#9C98AF">days left</text>
    <rect x="768" y="182" width="344" height="6" rx="3" fill="#34323F"/>
    <rect x="768" y="182" width="258" height="6" rx="3" fill="#9C98AF"/>
    <text x="768" y="210" font-size="15" fill="#9C98AF">75% of the time gone</text>
    <path d="M768 228 H1112" stroke="#2C2A36"/>
    <rect x="768" y="242" width="62" height="26" rx="13" fill="#3A2A16"/>
    <text x="799.0" y="260" font-size="15" font-weight="600" text-anchor="middle" fill="#F0A046">Tight</text>
    <text x="842" y="260" font-size="16" fill="#9C98AF">5 steps left · 1.5 h a day</text>
    <circle cx="774" cy="296" r="5" fill="#F07C80"/>
    <text x="788" y="302" font-size="17" fill="#EEECF5">Translate transcript</text>
    <text x="1112" y="302" font-size="15" font-weight="600" text-anchor="end" fill="#F07C80">Start overdue</text>
    <circle cx="774" cy="330" r="4.5" fill="none" stroke="#A48BFF" stroke-width="2"/>
    <text x="788" y="336" font-size="17" fill="#EEECF5">Recommendation letter</text>
    <text x="1112" y="336" font-size="15" text-anchor="end" fill="#9C98AF">Waiting 6 days</text>
  </g>
</svg>
